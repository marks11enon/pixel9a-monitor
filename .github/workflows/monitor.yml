name: monitor

on:
  schedule:
    # 毎時0分の混雑を避けて 2,7,12,…分に起動（5分間隔）
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "テスト通知だけ送る（状態は変えない）"
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # リレー（次の回の起動）に使う

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          if [ ! -x /usr/bin/google-chrome ]; then
            python -m playwright install --with-deps chromium
          fi

      - name: Test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run.py --test-notify

      - name: Check stock
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "最終コミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            python run.py --heartbeat
          else
            python run.py
          fi

      - name: Commit state.json if changed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 変化なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "update state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "push 完了"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::state.json を push できませんでした（次回の実行で再試行されます）"

      # GitHub の定期実行（schedule）が動かないことがあるため、各回の最後に次の回を起動する。
      # 開始から約5分たったら起動。待機中・実行中の回が他にあれば起動しない（二重化防止）。
      # 止めるときはワークフローを Disable すれば、起動が失敗してリレーも止まる。
      - name: Relay next run
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          wait=$(( 290 - ( $(date +%s) - JOB_START ) ))
          if [ "$wait" -gt 0 ]; then echo "次の回まで ${wait} 秒待機"; sleep "$wait"; fi
          others=$(gh run list -R "$REPO" --workflow monitor.yml --limit 20 \
            --json databaseId,status \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "${others:-0}" -gt 0 ]; then
            echo "他に待機中・実行中の回が ${others} 件あるため、起動しません"
            exit 0
          fi
          for i in 1 2 3; do
            if gh workflow run monitor.yml -R "$REPO" --ref main; then
              echo "次の回を起動しました"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::次の回を起動できませんでした（定期実行が動けばそこから再開します）"
