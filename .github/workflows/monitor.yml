name: monitor

on:
  schedule:
    # 毎時0分の混雑を避けて 2,7,12,…分に起動（5分間隔）
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "テスト通知だけ送る（状態は変えない）"
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          if [ ! -x /usr/bin/google-chrome ]; then
            python -m playwright install --with-deps chromium
          fi

      - name: Test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run.py --test-notify

      - name: Check stock
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "最終コミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            python run.py --heartbeat
          else
            python run.py
          fi

      - name: Commit state.json if changed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 変化なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "update state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "push 完了"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::state.json を push できませんでした（次回の実行で再試行されます）"
